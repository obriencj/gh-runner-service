# /etc/gh-runner/gh-runner.conf — global defaults.
#
# Loaded before every instance file; the instance file wins. Use this for what
# is true of the whole host, and instances.d/<id>.conf for what is not.
#
# Format is Podman --env-file, NOT systemd EnvironmentFile. Podman does no
# quote removal and no escape processing, so a quoted value keeps its quotes
# literally. Leave values unquoted. See gh-runner.conf(5).

# --- runtime env ---
RUNNER_LABELS=alma10,podman

# Wipe _work/_actions and _work/_tool between jobs as well as the checkout.
# Default 0 keeps the toolcache, which is most of the cold-start cost. See
# design §5.1 before turning this on.
#RUNNER_WIPE_WORK=0

# --- job-shaping: applied by the shim to each job container ---
# These are what bound a containerised workflow.
#JOB_MEMORY_MAX=12G
#JOB_CPUS=4

# --- unit-shaping: routed to a systemd drop-in by `gh-runner-ctl sync` ---
# These bound the runner process itself, and any job that runs *without* a
# container: block. They do NOT reach job containers — those are siblings in
# their own cgroup scope. Setting MEMORY_MAX and expecting it to stop a
# compiler in a container: job is the trap; use JOB_MEMORY_MAX for that.
MEMORY_MAX=2G
CPU_WEIGHT=100
